<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Subramanya Sharma B.G.{% endblock %} — AI & Data Engineer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
<canvas id="three-canvas"></canvas>

<nav class="navbar">
  <div class="nav-container">
    <a href="/" class="logo"><span class="logo-cube">◈</span> Subramanya Sharma <b class="G">B.G.</b></a>
    <div class="nav-links">
      <a href="/portfolio"      class="{% if active=='portfolio'      %}nav-active{% endif %}">Portfolio</a>
      <a href="/experience"     class="{% if active=='experience'     %}nav-active{% endif %}">Experience</a>
      <a href="/skills"         class="{% if active=='skills'         %}nav-active{% endif %}">Skills</a>
      <a href="/certifications" class="{% if active=='certifications' %}nav-active{% endif %}">Certifications</a>
      <a href="/about"          class="{% if active=='about'          %}nav-active{% endif %}">About</a>
      <a href="/resume-view" target="_blank" class="btn-resume-nav"><i class="fas fa-file-pdf"></i> Resume</a>
      <button id="theme-btn" class="btn-theme" onclick="toggleTheme()" title="Toggle light/dark mode"><i class="fas fa-sun"></i></button>
    </div>
  </div>
</nav>

<div id="page-wrap">
  {% block content %}{% endblock %}
</div>

<footer>
  <p>&copy; 2026 Subramanya Sharma B.G. &mdash; AI &amp; Data Engineer, Bengaluru</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{{ url_for('static', filename='js/gallery.js') }}"></script>
{% block page_js %}{% endblock %}
</body>
</html>
